<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Assessment</title>

<style>
  :root {
    --navy: #1f3a5f;
    --blue: #2f6fed;
    --light: #f3f6fb;
    --border: #d5deec;
    --ok: #1e8e4e;
    --text: #1d2433;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--light);
    color: var(--text);
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 16px 24px;
    font-size: 1.2rem;
    font-weight: 600;
  }

  main {
    max-width: 720px;
    margin: 28px auto;
    padding: 0 16px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 8px rgba(31, 58, 95, .06);
  }

  h2 {
    margin: 0 0 6px;
    color: var(--navy);
  }

  p.sub {
    margin: 0 0 20px;
    color: #5b667a;
    line-height: 1.5;
  }

  label {
    display: block;
    margin: 14px 0 6px;
    font-weight: 600;
    font-size: .92rem;
  }

  input[type="text"],
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }

  input[type="text"]:focus,
  select:focus {
    outline: 2px solid var(--blue);
    border-color: transparent;
  }

  button {
    margin-top: 22px;
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
  }

  button:disabled {
    background: #aab6cc;
    cursor: not-allowed;
  }

  .err {
    color: #c0392b;
    margin-top: 12px;
    min-height: 1.2em;
    font-size: .92rem;
  }

  .hidden {
    display: none;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: .9rem;
    color: #5b667a;
    margin-bottom: 8px;
  }

  .bar {
    height: 8px;
    background: #e4eaf5;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .bar > div {
    height: 100%;
    width: 0;
    background: var(--blue);
    transition: width .25s;
  }

  .qtext {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.45;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .opt:hover {
    background: #f0f5ff;
  }

  .opt.sel {
    border-color: var(--blue);
    background: #e8f0ff;
  }

  .opt .letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e4eaf5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: .85rem;
    flex: none;
  }

  .opt.sel .letter {
    background: var(--blue);
    color: #fff;
  }

  .result {
    text-align: center;
  }

  .score {
    font-size: 3rem;
    font-weight: 700;
    color: var(--ok);
    margin: 10px 0 0;
  }

  @media (max-width: 520px) {
    .card {
      padding: 20px;
    }

    header {
      padding: 16px;
    }

    .score {
      font-size: 2.5rem;
    }
  }
</style>
</head>

<body>

<header>Student Results Assessment</header>

<main>

  <!-- Step 1: Student details -->
  <section id="start" class="card">

    <h2>Welcome</h2>

    <p class="sub">
      Enter your details to begin.
      The quiz has 20 multiple-choice questions.
    </p>

    <label for="name">Name</label>
    <input
      type="text"
      id="name"
      autocomplete="off"
      placeholder="Your full name"
      required
    >

    <label for="cls">Class</label>
    <select id="cls" required>
      <option value="">Select Class</option>
      <option value="11">11</option>
      <option value="12">12</option>
    </select>

    <label for="group">Group</label>
    <select id="group" required>
      <option value="">Select Group</option>
      <option value="Group 1 - Maths and Biology">
        Group 1 - Maths and Biology
      </option>
      <option value="Group 2 - Computer Science and Maths">
        Group 2 - Computer Science and Maths
      </option>
      <option value="Group 3 - Commerce">
        Group 3 - Commerce
      </option>
    </select>

    <div class="err" id="startErr" role="alert"></div>

    <button id="startBtn" type="button">
      Start Quiz
    </button>

  </section>


  <!-- Step 2: Quiz -->
  <section id="quiz" class="card hidden">

    <div class="topbar">
      <span id="counter"></span>
      <span id="who"></span>
    </div>

    <div
      class="bar"
      role="progressbar"
      aria-label="Quiz progress"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div id="progress"></div>
    </div>

    <div class="qtext" id="qtext"></div>

    <div id="options"></div>

    <div class="err" id="quizErr" role="alert"></div>

    <button id="nextBtn" type="button" disabled>
      Next
    </button>

  </section>


  <!-- Step 3: Results -->
  <section id="done" class="card result hidden">

    <h2>Quiz Completed</h2>

    <p class="sub" id="doneName"></p>

    <div class="score" id="scoreText"></div>

    <p class="sub" id="pctText"></p>

    <p class="sub">
      Your responses have been recorded.
      You may close this page.
    </p>

  </section>

</main>


<script>
  const $ = id => document.getElementById(id);

  let questions = [];
  let answers = [];
  let current = 0;
  let qStart = 0;
  let selected = null;
  let student = {};

  // --------------------------------------------------
  // START QUIZ
  // --------------------------------------------------

  $("startBtn").onclick = async () => {

    const name = $("name").value.trim();
    const cls = $("cls").value;
    const group = $("group").value;

    $("startErr").textContent = "";

    if (!name || !cls || !group) {
      $("startErr").textContent =
        "Please enter your name, select your class, and select your group.";
      return;
    }

    if (!["11", "12"].includes(cls)) {
      $("startErr").textContent =
        "Only Classes 11 and 12 are allowed.";
      return;
    }

    const validGroups = [
      "Group 1 - Maths and Biology",
      "Group 2 - Computer Science and Maths",
      "Group 3 - Commerce"
    ];

    if (!validGroups.includes(group)) {
      $("startErr").textContent =
        "Please select a valid group.";
      return;
    }

    $("startBtn").disabled = true;
    $("startErr").textContent = "Loading questions...";

    try {

      const r = await fetch("/api/questions");
      const data = await r.json();

      if (!r.ok) {
        throw new Error(
          data.error || "Could not load questions."
        );
      }

      if (!Array.isArray(data.questions) ||
          data.questions.length === 0) {
        throw new Error("No questions available.");
      }

      questions = data.questions;

      // Validate the question structure before starting.
      questions.forEach((q, index) => {
        if (
          q.id === undefined ||
          typeof q.question !== "string" ||
          !Array.isArray(q.options) ||
          q.options.length < 2
        ) {
          throw new Error(
            "Invalid question data at question " + (index + 1) + "."
          );
        }
      });

    } catch (e) {

      $("startErr").textContent = e.message;
      $("startBtn").disabled = false;
      return;

    }

    student = {
      name: name,
      class: cls,
      group: group
    };

    $("who").textContent =
      name + " | Class " + cls + " | " + group;

    $("start").classList.add("hidden");
    $("quiz").classList.remove("hidden");

    showQuestion();
  };


  // --------------------------------------------------
  // DISPLAY CURRENT QUESTION
  // --------------------------------------------------

  function showQuestion() {

    const q = questions[current];

    selected = null;

    $("counter").textContent =
      "Question " + (current + 1) +
      " of " + questions.length;

    const percentage = (current / questions.length) * 100;

    $("progress").style.width = percentage + "%";

    document.querySelector(".bar").setAttribute(
      "aria-valuenow",
      String(Math.round(percentage))
    );

    $("qtext").textContent = q.question;

    $("nextBtn").textContent =
      current === questions.length - 1
        ? "Submit"
        : "Next";

    $("nextBtn").disabled = true;
    $("quizErr").textContent = "";

    const box = $("options");

    box.replaceChildren();

    q.options.forEach((optionText, i) => {

      const d = document.createElement("div");
      d.className = "opt";
      d.setAttribute("role", "button");
      d.setAttribute("tabindex", "0");
      d.setAttribute("aria-pressed", "false");

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = "ABCD"[i] || String(i + 1);

      const text = document.createElement("span");
      text.textContent = optionText;

      d.appendChild(letter);
      d.appendChild(text);

      function selectOption() {

        selected = i;

        Array.from(box.children).forEach(option => {
          option.classList.remove("sel");
          option.setAttribute("aria-pressed", "false");
        });

        d.classList.add("sel");
        d.setAttribute("aria-pressed", "true");

        $("nextBtn").disabled = false;
      }

      d.onclick = selectOption;

      d.onkeydown = event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectOption();
        }
      };

      box.appendChild(d);
    });

    // Start timing when the question is displayed.
    qStart = performance.now();
  }


  // --------------------------------------------------
  // NEXT QUESTION / SUBMIT QUIZ
  // --------------------------------------------------

  $("nextBtn").onclick = async () => {

    if (selected === null) {
      $("quizErr").textContent =
        "Please select an answer before continuing.";
      return;
    }

    // Prevent double clicks during submission.
    $("nextBtn").disabled = true;
    $("quizErr").textContent = "";

    const seconds =
      (performance.now() - qStart) / 1000;

    const answer = {
      id: questions[current].id,
      selected: selected,
      time: Math.round(seconds * 100) / 100
    };

    // Save the answer for the current question.
    answers[current] = answer;

    // Move to the next question if available.
    if (current < questions.length - 1) {
      current++;
      showQuestion();
      return;
    }

    // ------------------------------------------------
    // SUBMIT ALL ANSWERS
    // ------------------------------------------------

    $("nextBtn").textContent = "Submitting...";

    try {

      const r = await fetch("/api/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: student.name,
          class: student.class,
          group: student.group,
          answers: answers
        })
      });

      const res = await r.json();

      if (!r.ok) {
        throw new Error(
          res.error || "Submission failed."
        );
      }

      // Display the final result.
      $("quiz").classList.add("hidden");
      $("done").classList.remove("hidden");

      $("doneName").textContent =
        student.name +
        " (Class " + student.class +
        " | " + student.group + ")";

      $("scoreText").textContent =
        res.score + " / " + res.total;

      $("pctText").textContent =
        res.percentage + "%";

      $("progress").style.width = "100%";

    } catch (e) {

      $("quizErr").textContent =
        e.message +
        " Please check your connection and retry submission.";

      $("nextBtn").textContent = "Retry Submit";
      $("nextBtn").disabled = false;

    }
  };

</script>

</body>
</html>
